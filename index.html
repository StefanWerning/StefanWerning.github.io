  // Helper function to find the country by prefix
  function getCountryFromPrefix(prefixStr) {
    let prefix = parseInt(prefixStr, 10);
    
    // Safety check if the barcode was shorter than 3 characters or not a number
    if (isNaN(prefix)) return "Invalid Barcode";

    for (let i = 0; i < gs1Ranges.length; i++) {
      if (prefix >= gs1Ranges[i].min && prefix <= gs1Ranges[i].max) {
        let tmp="";
        if (gs1Ranges[i].img.length != 0) tmp=gs1Ranges[i].img;
        return [gs1Ranges[i].name,tmp];
      }
    }
    
    // EAN/UPC prefixes not on the list are reserved for future use or internal 
    return "Country Unknown / Reserved";
  }

  function setup() {
    createCanvas(windowWidth, windowHeight);

    let constraints = {
      video: {
        facingMode: { exact: "environment" }
      },
      audio: false
    };

    try {
      capture = createCapture(constraints);
    } catch (e) {
      capture = createCapture(VIDEO);
    }
    capture.hide(); 

    if ('BarcodeDetector' in window) {
      barcodeDetector = new BarcodeDetector({ 
        formats: ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e'] 
      });
    } else {
      barcodeText = "Barcode API not supported.";
    }
  }

  function draw() {
    background(34);
    text('v0.2', 15, 15);
    if (capture.width > 0) {
      let videoAspect = capture.width / capture.height;
      let canvasAspect = width / height;
      let drawWidth, drawHeight;

      if (canvasAspect > videoAspect) {
        drawWidth = width;
        drawHeight = width / videoAspect;
      } else {
        drawHeight = height;
        drawWidth = height * videoAspect;
      }

      let x = (width - drawWidth) / 2;
      let y = (height - drawHeight) / 2;

      image(capture, x, y, drawWidth, drawHeight);

      // Scan for barcodes every 10 frames
      if (barcodeDetector && frameCount % 10 === 0) {
        barcodeDetector.detect(capture.elt)
          .then(barcodes => {
            if (barcodes.length > 0) {
              barcodeText = barcodes[0].rawValue;
              
              // NEW LOGIC: Slice the first 3 characters and get the country
              let prefixStr = barcodeText.substring(0, 3);
              countryData = getCountryFromPrefix(prefixStr);
            }
          })
          .catch(err => {
            console.error(err);
          });
      }
    }

    // Target Box
    noFill();
    stroke(0, 255, 0);
    strokeWeight(4);
    rectMode(CENTER);
    rect(width / 2, height / 2, width * 0.7, height * 0.2, 20);

    // Text box at the bottom (made slightly taller to fit two lines of text)
    rectMode(CORNER);
    fill(0, 150);
    noStroke();
    rect(0, height - 120, width, 120); 

    // Display the barcode raw number
    fill(0, 255, 0);
    textSize(24);
    textAlign(CENTER, CENTER);
    text(barcodeText, width / 2, height - 85);

    // Display the calculated country
    fill(255); // White color to differentiate from the barcode number
    textSize(18);
    text(countryData[0], width / 2, height - 40);
    const imgElement = document.getElementById(countryData[1]);
  }

  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
  }
